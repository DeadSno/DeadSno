<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Vladislav — системный аналитик, данные и AI-агенты">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111b30"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="958" height="238" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <circle cx="760" cy="96" r="150" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="905" cy="205" r="110" fill="url(#accent)" opacity="0.07" filter="url(#soft)"/>

  <rect x="42" y="52" width="4" height="136" rx="2" fill="url(#accent)"/>

  <text x="66" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" fill="#22d3ee">SYSTEM ANALYST · DATA &amp; AI AGENTS</text>
  <text x="64" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#f0f6fc">Vladislav <tspan fill="#7d8590" font-weight="400">·</tspan> DeadSno</text>
  <text x="66" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#9fb3c8">Воспроизводимый анализ данных и инструменты для AI-агентов</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">
    <rect x="65" y="183" width="70" height="27" rx="13.5" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="201" text-anchor="middle">Python</text>
    <rect x="143" y="183" width="50" height="27" rx="13.5" fill="#161b22" stroke="#30363d"/>
    <text x="168" y="201" text-anchor="middle">SQL</text>
    <rect x="201" y="183" width="74" height="27" rx="13.5" fill="#161b22" stroke="#30363d"/>
    <text x="238" y="201" text-anchor="middle">DuckDB</text>
    <rect x="283" y="183" width="86" height="27" rx="13.5" fill="#161b22" stroke="#30363d"/>
    <text x="326" y="201" text-anchor="middle">Streamlit</text>
    <rect x="377" y="183" width="98" height="27" rx="13.5" fill="#161b22" stroke="#30363d"/>
    <text x="426" y="201" text-anchor="middle">TypeScript</text>
  </g>

  <g stroke="#22d3ee" stroke-opacity="0.38" stroke-width="1.5" fill="none">
    <path d="M700 70 L790 104 L700 70 M790 104 L880 62 M790 104 L742 178 M790 104 L884 166 M700 70 L742 178 M742 178 L884 166"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="700" cy="70" r="6"/>
    <circle cx="880" cy="62" r="5"/>
    <circle cx="742" cy="178" r="7"/>
    <circle cx="884" cy="166" r="5"/>
  </g>
  <circle cx="790" cy="104" r="10" fill="#0d1117" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="790" cy="104" r="3" fill="#22d3ee"/>
</svg>
